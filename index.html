 const l=UL.filter(u=>!q||(u.full_name+' '+u.username).toLowerCase().includes(q));
 const bt=(t,fn,c)=>`<button class="btn ${c||''} s" style="margin:6px 0 0 6px" onclick="${fn}">${t}</button>`;
 const acts=u=>{if(u.id===session.id)return '<span class="tag">أنت</span>';if(u.role==='owner')return '';let h='';
  if(session.manage){if(!u.role)h+=bt('تعيين مشرف',`setAdmin('${u.id}',true)`);else if(!u.can_manage||session.owner)h+=bt('إزالة الإشراف',`setAdmin('${u.id}',false)`,'r')}
  if(session.owner&&u.role==='admin')h+=bt(u.can_manage?'سحب صلاحية إدارة المشرفين':'منح صلاحية إدارة المشرفين',`setManager('${u.id}',${!u.can_manage})`,'g');return h};
 box.innerHTML=`<div class="tiles"><div class="tl"><b>${UL.length}</b><span>مستخدم</span></div><div class="tl"><b>${UL.filter(u=>u.role).length}</b><span>مشرف</span></div><div class="tl"><b>${tot}</b><span>${UNIT} مُشاهدة</span></div></div>
 <input id="uq" placeholder="ابحث بالاسم أو اسم المستخدم" value="${esc(q)}" oninput="drawUsers()" style="margin:0 0 10px">
 <div class="list">${l.map(u=>`<div class="li" style="cursor:default;align-items:flex-start"><div class="av2">${avH(u.full_name,u.avatar_path)}</div><div class="grow"><h3>${esc(u.full_name)}</h3><div class="mute">@${esc(u.username)} · ${roleTxt(u)} · ${UC[u.id]||0} ${UNIT}</div><div>${acts(u)}</div></div></div>`).join('')||'<div class="li mute">لا يوجد مستخدمون.</div>'}</div>
 <div class="mute" style="margin-top:10px">${!session.manage?'عرض فقط: تعيين المشرفين متاح لمن يملك صلاحية إدارة المشرفين.':session.owner?'أنت المالك: تتحكم في تعيين المشرفين ومنح صلاحية إدارتهم.':'يمكنك تعيين المشرفين وإزالتهم، لكن لا تتحكم في المالك ولا في من يملك صلاحية إدارة المشرفين.'}</div>`;
 const i=$('#uq');if(q&&i){i.focus();i.setSelectionRange(q.length,q.length)}}
function setAdmin(id,v){const u=UL.find(x=>x.id===id);if(!u)return;
 yes(v?'تعيين '+u.full_name+' مشرفًا؟ سيقدر يضيف ويحذف المحتوى في هذا الموقع فقط.':'إزالة الإشراف عن '+u.full_name+'؟',async()=>{
  const {error}=await sb.rpc('set_site_admin',{target:id,s:SITE,make:v});if(error)return toast('غير مسموح لك بهذا الإجراء');toast(v?'تم التعيين كمشرف':'تمت إزالة الإشراف');loadUsers()},v?'نعم، عيّنه':'نعم، أزل')}
function setManager(id,v){const u=UL.find(x=>x.id===id);if(!u)return;
 yes(v?'منح '+u.full_name+' صلاحية تعيين وإزالة المشرفين؟':'سحب صلاحية إدارة المشرفين من '+u.full_name+'؟',async()=>{
  const {error}=await sb.rpc('set_site_manager',{target:id,s:SITE,v});if(error)return toast('هذا الإجراء للمالك فقط');toast(v?'تم منح الصلاحية':'تم سحب الصلاحية');loadUsers()},v?'نعم، امنحه':'نعم، اسحبها')}

/* الإعلانات */
let ANN=[];
const annSort=(a,b)=>(Number(b.pinned)-Number(a.pinned))||(Date.parse(b.created_at)-Date.parse(a.created_at));
async function loadAnn(){const {data}=await sb.from('site_announcements').select('*').limit(80);ANN=(data||[]).sort(annSort)}
const annHere=()=>ANN.filter(a=>a.site==='both'||a.site===SITE);
const annDate=d=>new Date(d).toLocaleDateString('ar-EG',{day:'numeric',month:'short'});
function annBlock(){const l=annHere();if(!l.length)return '';const pin=l.filter(a=>a.pinned),rest=l.filter(a=>!a.pinned).slice(0,3);
 return `<div class="ann">${[...pin,...rest].map(a=>`<div class="an${a.pinned?' pin':''}"><div class="rw"><b>${a.pinned?'📌 ':'📢 '}${esc(a.title||'إعلان')}</b><span class="mute">${annDate(a.created_at)}</span></div><div class="ab">${esc(a.body)}</div></div>`).join('')}</div>`}
function annAdmin(){const other=SITE==='watch'?'read':'watch';
 return `<div class="card"><label>عنوان (اختياري)</label><input id="an_t" maxlength="80"><label>نص الإعلان</label><textarea id="an_b" rows="4" maxlength="1000" placeholder="اكتب ما تريد أن يظهر في الرئيسية..."></textarea>
 <label>أين يظهر؟</label><select id="an_s"><option value="both">الموقعين</option><option value="${SITE}">هذا الموقع فقط</option><option value="${other}">${other==='read'?'القارئ':'Watch'} فقط</option></select>
 <label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="an_p" style="width:auto;margin:0"> 📌 تثبيت في أعلى الرئيسية</label><button class="btn" onclick="addAnn()">نشر الإعلان</button></div>
 <div class="list">${ANN.map(a=>`<div class="li" style="cursor:default;align-items:flex-start"><div class="grow"><h3>${a.pinned?'📌 ':''}${esc(a.title||'إعلان')}</h3><div class="mute" style="white-space:pre-wrap">${esc(a.body.slice(0,140))}${a.body.length>140?'…':''}</div><div class="mute">${a.site==='both'?'الموقعين':a.site===SITE?'هذا الموقع':'الموقع الآخر'} · ${annDate(a.created_at)}</div><div><button class="btn g s" onclick="pinAnn(${a.id},${!a.pinned})">${a.pinned?'إلغاء التثبيت':'📌 تثبيت'}</button><button class="btn r s" onclick="delAnn(${a.id})">حذف</button></div></div></div>`).join('')||'<div class="li mute">لا توجد إعلانات.</div>'}</div>`}
async function addAnn(){const b=$('#an_b').value.trim();if(!b)return toast('اكتب نص الإعلان');
 const {data,error}=await sb.from('site_announcements').insert({site:$('#an_s').value,title:$('#an_t').value.trim()||null,body:b,pinned:$('#an_p').checked}).select().single();
 if(error)return toast('غير مسموح، الإعلانات للمالك فقط');ANN.push(data);ANN.sort(annSort);toast('تم النشر');adminV()}
async function pinAnn(id,v){const {error}=await sb.from('site_announcements').update({pinned:v}).eq('id',id);if(error)return toast('تعذر التحديث');
 const a=ANN.find(x=>x.id===id);if(a)a.pinned=v;ANN.sort(annSort);toast(v?'تم التثبيت':'أُلغي التثبيت');adminV()}
function delAnn(id){yes('حذف هذا الإعلان؟',async()=>{const {error}=await sb.from('site_announcements').delete().eq('id',id);if(error)return toast('تعذر الحذف');ANN=ANN.filter(x=>x.id!==id);adminV()})}

/* ===== مركز الأمان (للمالك فقط) + حالة الموقع للمستخدمين ===== */
let SEC={lockdown:false,comments_enabled:true,signups_open:true,message:null},BAN=null,JOINERR=false;
const cmOff=()=>!SEC.comments_enabled&&!(session&&session.admin);
const incomplete=()=>{const m=JOINERR?'الانضمام لهذا الموقع غير متاح حاليًا (التسجيل مغلق أو الحساب موقوف)':'الحساب غير مكتمل';JOINERR=false;toast(m)};
async function secState(uid){
 const a=await sb.from('site_security').select('lockdown,comments_enabled,signups_open,message').eq('site',SITE).maybeSingle();
 SEC=a.data||{lockdown:false,comments_enabled:true,signups_open:true,message:null};
 const b=await sb.from('site_bans').select('reason,until').eq('user_id',uid).eq('site',SITE).maybeSingle();
 BAN=b.data&&(!b.data.until||new Date(b.data.until)>new Date())?b.data:null;
 session.blocked=session.owner?null:BAN?'ban':(SEC.lockdown&&!session.admin?'lock':null)}
function blockedV(){const ban=session.blocked==='ban';$('#nav').style.display='none';
 $('#app').innerHTML=`<div class="card" style="text-align:center;padding:36px 20px"><div style="font-size:54px">${ban?'⛔':'🔒'}</div><h2 style="justify-content:center">${ban?'تم إيقاف حسابك':'الموقع مغلق مؤقتًا'}</h2><div class="mute" style="white-space:pre-wrap">${ban?esc(BAN.reason||'لم يُذكر سبب.')+(BAN.until?'\nحتى '+new Date(BAN.until).toLocaleDateString('ar-EG'):'\nالإيقاف دائم.'):esc(SEC.message||'نعمل على الصيانة، يرجى المحاولة لاحقًا.')}</div><button class="btn g" onclick="logout()">تسجيل الخروج</button></div>`}
let secSite=SITE,secCfg=null,secU=[],secA=[],secQ='';
const SITE_NAMES={watch:'Watch',read:'القارئ'};
const SEC_ACT={ban:'🚫 حظر مستخدم',unban:'✅ فك حظر',settings:'⚙️ تغيير إعدادات الأمان',revoke_sessions:'📴 إنهاء جلسات مستخدم',delete_account:'🗑 حذف حساب',role_set:'🛡 تعيين مشرف',role_changed:'🛡 تعديل صلاحيات مشرف',role_removed:'🛡 إزالة مشرف'};
const SEC_TBL={lib_titles:'عمل',lib_videos:'فيديو',rd_works:'عمل',rd_chapters:'فصل',lib_comments:'تعليق',rd_comments:'تعليق'};
async function secLoad(){const box=$('#sc');if(!box)return;box.innerHTML='<div class="mute" style="padding:12px">جارٍ التحميل...</div>';
 const [c,u,a]=await Promise.all([sb.from('site_security').select('*').eq('site',secSite).maybeSingle(),sb.rpc('owner_users',{s:secSite}),sb.from('security_audit').select('*').or('site.eq.'+secSite+',site.is.null').order('id',{ascending:false}).limit(60)]);
 if(u.error||c.error||!c.data){box.innerHTML='<div class="card mute">مركز الأمان غير مفعّل بعد في قاعدة البيانات. شغّل ملف owner-security.sql في Supabase أولًا.</div>';return}
 secCfg=c.data;secU=u.data||[];secA=a.data||[];secDraw()}
function secRow(x){const me=x.id===session.id,own=x.role==='owner',bd=hue(x.username);
 const st=x.banned?`<span class="tag" style="background:#3a1c22;color:#ff8f93">محظور${x.ban_until?' حتى '+new Date(x.ban_until).toLocaleDateString('ar-EG'):' نهائيًا'}</span>`:'';
 const acts=(me||own)?`<span class="tag">${me?'أنت':'مالك'}</span>`:`<div style="display:flex;gap:6px;flex-wrap:wrap">${x.banned?`<button class="btn g s" style="margin:0" onclick="secUnban('${x.id}')">فك الحظر</button>`:`<button class="btn r s" style="margin:0" onclick="secBanDlg('${x.id}')">حظر</button>`}<button class="btn g s" style="margin:0" onclick="secKick('${x.id}')">إنهاء الجلسات</button><button class="btn r s" style="margin:0" onclick="secDel('${x.id}')">حذف</button></div>`;
 return `<div class="li" style="cursor:default;flex-wrap:wrap"><div style="flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:700;color:#fff;background:hsl(${bd} 55% 45%)">${avH(x.full_name,x.avatar_path)}</div><div class="grow"><h3>${esc(x.full_name)}</h3><div class="mute">@${esc(x.username)}${x.role?' · '+(own?'مالك':'مشرف'):''} ${st}</div></div>${acts}</div>`}
function secLogRow(a){const d=a.detail||{};let det='';
 if(a.action==='settings')det=(d.lockdown?'القفل مفعّل':'القفل متوقف')+' · '+(d.comments?'التعليقات مفتوحة':'التعليقات مغلقة')+' · '+(d.signups?'الانضمام مفتوح':'الانضمام مغلق');
 else if(a.action==='ban')det=(d.reason||'بدون سبب')+' · '+(d.days?d.days+' يوم':'دائم');
 else if(a.action==='delete_account')det='@'+(d.username||'');
 else if(a.action.startsWith('delete_'))det=d.name||'';
 const tb=a.action.startsWith('delete_')&&a.action!=='delete_account'?a.action.slice(7):'';
 const label=SEC_ACT[a.action]||('🗑 حذف '+(SEC_TBL[tb]||'محتوى'));
 return `<div class="li" style="cursor:default;align-items:flex-start"><div class="grow"><h3 style="font-size:14px">${label}${a.target_name?' · '+esc(a.target_name):''}</h3>${det?`<div class="mute">${esc(det)}</div>`:''}<div class="mute">بواسطة ${esc(a.actor_name||'—')} · ${new Date(a.at).toLocaleString('ar-EG')}</div></div></div>`}
function secUList(){const b=$('#sc_ul');if(!b)return;const q=secQ.trim().toLowerCase(),l=secU.filter(x=>!q||(x.full_name+' '+x.username).toLowerCase().includes(q));
 b.innerHTML=l.map(secRow).join('')||'<div class="li mute">لا يوجد مستخدمون.</div>'}
function secDraw(){const box=$('#sc');if(!box)return;
 box.innerHTML=`<div class="chips">${['watch','read'].map(s=>`<button class="${secSite===s?'on':''}" onclick="secSite='${s}';secLoad()">${SITE_NAMES[s]}${s===SITE?' (هنا)':''}</button>`).join('')}</div>
 <div class="card"><h3>حالة ${SITE_NAMES[secSite]}</h3>
 ${[['sc_l','lockdown','🔒 قفل الموقع (لا يدخله إلا المشرفون)'],['sc_c','comments_enabled','💬 السماح بالتعليقات'],['sc_s','signups_open','🆕 السماح بانضمام مستخدمين جدد']].map(([id,k,t])=>`<label style="display:flex;gap:10px;align-items:center;margin:10px 0;color:var(--ink);font-size:14px"><input type="checkbox" id="${id}" ${secCfg[k]?'checked':''} style="width:auto;margin:0"> ${t}</label>`).join('')}
 <label>رسالة تظهر للمستخدمين أثناء القفل</label><textarea id="sc_m" rows="2" maxlength="300">${esc(secCfg.message||'')}</textarea>
 <button class="btn" onclick="secSave()">حفظ الإعدادات</button></div>
 <h2>المستخدمون (${secU.length})</h2><input id="sc_q" placeholder="ابحث بالاسم أو اسم المستخدم" value="${esc(secQ)}" oninput="secQ=this.value;secUList()" style="margin-bottom:10px">
 <div class="list" id="sc_ul"></div>
 <div class="rw"><h2>سجل الأحداث</h2><button class="btn g s" style="margin:0" onclick="secLoad()">تحديث</button></div>
 <div class="list">${secA.map(secLogRow).join('')||'<div class="li mute">لا توجد أحداث بعد.</div>'}</div>`;
 secUList()}
async function secSave(){const {error}=await sb.rpc('owner_set_security',{s:secSite,p_lockdown:$('#sc_l').checked,p_comments:$('#sc_c').checked,p_signups:$('#sc_s').checked,p_msg:$('#sc_m').value});
 if(error)return toast('تعذر الحفظ');toast('تم حفظ إعدادات الأمان');if(secSite===SITE)await secState(session.id);secLoad()}
function secBanDlg(id){const u=secU.find(x=>x.id===id);if(!u)return;const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="card"><h3>حظر ${esc(u.full_name)}</h3><label>المدة</label><select id="bn_d"><option value="1">يوم واحد</option><option value="7">7 أيام</option><option value="30">30 يومًا</option><option value="">دائم</option></select><label>السبب (يظهر له)</label><input id="bn_r" maxlength="200"><label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="bn_k" checked style="width:auto;margin:0"> إنهاء جلساته فورًا</label><div class="rw"><button class="btn r" id="bn_ok">حظر</button><button class="btn g" id="bn_no">إلغاء</button></div></div>`;
 document.body.append(o);o.querySelector('#bn_no').onclick=()=>o.remove();
 o.querySelector('#bn_ok').onclick=async()=>{const d=$('#bn_d').value,r=$('#bn_r').value,k=$('#bn_k').checked;o.remove();
  const {error}=await sb.rpc('owner_ban',{target:id,s:secSite,p_reason:r,p_days:d===''?null:parseInt(d,10)});if(error)return toast('تعذر الحظر');
  if(k)await sb.rpc('owner_revoke_sessions',{target:id});toast('تم الحظر');secLoad()}}
async function secUnban(id){const {error}=await sb.rpc('owner_unban',{target:id,s:secSite});if(error)return toast('تعذر فك الحظر');toast('تم فك الحظر');secLoad()}
function secKick(id){yes('إنهاء كل جلسات هذا المستخدم؟ سيحتاج لتسجيل الدخول من جديد.',async()=>{const {error}=await sb.rpc('owner_revoke_sessions',{target:id});if(error)return toast('تعذر التنفيذ');toast('تم إنهاء الجلسات');secLoad()},'نعم، أنهِها')}
function secDel(id){const u=secU.find(x=>x.id===id);if(!u)return;yes('حذف حساب «'+u.full_name+'» نهائيًا مع كل بياناته في الموقعين؟ لا يمكن التراجع.',async()=>{const {error}=await sb.rpc('owner_delete_account',{target:id});if(error)return toast('تعذر الحذف');toast('تم حذف الحساب');secLoad()},'نعم، احذف الحساب')}
/* ===== تطبيق (PWA): التسجيل، التثبيت، حالة الاتصال ===== */
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
let DEFER=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function showInstall(msg){if($('#inst')||isStandalone())return;const b=document.createElement('button');b.id='inst';b.className='inst';
 if(msg){b.innerHTML='📲 ثبّت التطبيق<small>'+msg+'</small>';b.onclick=()=>{ls.set('iosHint',1);b.remove()}}
 else{b.textContent='📲 ثبّت التطبيق';b.onclick=async()=>{try{DEFER.prompt();await DEFER.userChoice}catch(e){}DEFER=null;b.remove()}}
 document.body.append(b)}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e;showInstall()});
addEventListener('appinstalled',()=>{DEFER=null;const b=$('#inst');if(b)b.remove();toast('تم تثبيت التطبيق')});
addEventListener('offline',()=>toast('لا يوجد اتصال بالإنترنت'));
addEventListener('online',()=>toast('عاد الاتصال'));
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!isStandalone()&&!ls.get('iosHint',0))setTimeout(()=>showInstall('اضغط زر المشاركة ثم "إضافة إلى الشاشة الرئيسية"'),2500);
boot();
</script>
</body>
</html>
